<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos · Painel Gab's</title>
  <link rel="icon" href="img/logo-gabs.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tema.css">
</head>
<body>
  <main id="conteudo" class="pagina oculto">
    <div class="pagina-topo">
      <div>
        <h1 class="pagina-titulo">Pedidos do dia</h1>
        <p class="pagina-sub" id="dataDia"></p>
      </div>
      <div class="linha">
        <button class="btn" id="btnTempo">⏱️ <span id="txtTempo">Tempo de entrega</span></button>
        <button class="btn" id="btnPix">⚡ Chave PIX</button>
        <button class="btn btn-g" id="btnRecebimento">🔄 Verificando…</button>
        <button class="btn btn-g" id="btnEntregas" title="Pausa só os pedidos de entrega; a retirada continua">🛵 Entregas…</button>
      </div>
    </div>

    <p class="faixa faixa-info" id="avisoSom" style="margin-bottom:14px">
      🔔 Clique em qualquer lugar da tela para ativar o som de novos pedidos.
    </p>

    <div class="linha" style="margin-bottom:16px">
      <div class="pilulas" id="filtroStatus"></div>
      <div class="pilulas" id="filtroTipo"></div>
      <input class="campo" id="busca" type="search" name="buscaPedidos" autocomplete="off" placeholder="🔍 Nome do cliente ou nº da mesa" style="max-width:320px">
    </div>

    <div class="grade" id="listaPedidos"></div>
    <p class="vazio oculto" id="vazio">Nenhum pedido por aqui.</p>
  </main>

  <div class="alerta-novo oculto" id="alertaNovo">🚨 Novo pedido recebido!</div>
  <audio id="alertaSom" src="alerta.mp3" preload="auto"></audio>

  <script type="module" src="js/pedidos.js?v=1.0.1"></script>
</body>
</html>
