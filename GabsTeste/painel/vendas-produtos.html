<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendas por produto · Painel Gab's</title>
  <link rel="icon" href="img/logo-gabs.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tema.css">
</head>
<body>
  <main id="conteudo" class="pagina oculto">
    <div class="pagina-topo">
      <div>
        <h1 class="pagina-titulo">Vendas por produto</h1>
        <p class="pagina-sub">Ranking dos itens vendidos (pedidos concluídos)</p>
      </div>
    </div>

    <div class="card linha" style="margin-bottom:16px">
      <input class="campo" type="search" id="busca" placeholder="🔍 Buscar produto…" style="max-width:260px">
      <label class="rotulo" style="margin:0">De</label><input class="campo" type="date" id="dataInicio" style="width:auto">
      <label class="rotulo" style="margin:0">até</label><input class="campo" type="date" id="dataFim" style="width:auto">
      <button class="btn btn-primario" id="btnAtualizar">🔄 Atualizar</button>
    </div>

    <div class="grade-2" style="margin-bottom:16px">
      <div class="card"><p class="kpi-rotulo">Produtos diferentes</p><p class="kpi-valor" id="produtosDiferentes">0</p></div>
      <div class="card"><p class="kpi-rotulo">Total de itens vendidos</p><p class="kpi-valor" id="totalItens">0</p></div>
      <div class="card card-destaque"><p class="kpi-rotulo">Produto campeão</p><p class="kpi-valor" style="font-size:22px" id="produtoCampeao">-</p></div>
    </div>

    <div class="grade-2">
      <div class="card" style="padding:0; overflow:hidden">
        <h2 class="card-titulo" style="padding:16px 16px 4px">🍕 Produtos</h2>
        <table class="tabela"><tbody id="tabelaProdutos"></tbody></table>
      </div>
      <div class="card" style="padding:0; overflow:hidden">
        <h2 class="card-titulo" style="padding:16px 16px 4px">🥤 Outros</h2>
        <table class="tabela"><tbody id="tabelaBebidas"></tbody></table>
      </div>
    </div>
  </main>
  <script type="module" src="js/vendas.js?v=1.0.3"></script>
</body>
</html>
