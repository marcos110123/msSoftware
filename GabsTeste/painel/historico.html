<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico · Painel Gab's</title>
  <link rel="icon" href="img/logo-gabs.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tema.css">
  <style>
    .hist-dia { margin-bottom: 22px; }
    .hist-dia-cab { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0 4px 8px; }
    .hist-dia-cab h2 { font-size: 17px; font-weight: 800; text-transform: capitalize; }
    .hist-dia-cab span { font-size: 13px; color: var(--texto-3); }
    .hist-itens { display: grid; gap: 8px; }
    .hist-linha { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: none; border: 0; cursor: pointer; text-align: left; font: inherit; color: inherit; }
    .hist-linha:hover { background: var(--superficie-2); }
    .hist-hora { font-weight: 800; font-size: 15px; color: var(--texto-2); width: 48px; flex-shrink: 0; }
    .hist-nome { flex: 1; min-width: 0; }
    .hist-nome b, .hist-nome small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hist-nome small { color: var(--texto-3); font-size: 13px; margin-top: 2px; }
    .hist-total { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .hist-total b { font-size: 16px; }
    .hist-seta { color: var(--texto-3); font-size: 12px; flex-shrink: 0; }
    .hist-pedido .pedido-itens { margin-top: 6px; }
  </style>
</head>
<body>
  <main id="conteudo" class="pagina oculto" style="max-width:1000px">
    <div class="pagina-topo">
      <div>
        <h1 class="pagina-titulo">Histórico de pedidos</h1>
        <p class="pagina-sub">Pedidos de qualquer dia. Clique no pedido para ver os detalhes e reimprimir.</p>
      </div>
    </div>

    <div class="linha" style="margin-bottom:10px">
      <div class="pilulas" id="atalhos"></div>
      <div class="card linha" style="padding:6px 10px">
        <input class="campo" type="date" id="dataInicio" style="width:auto">
        <span class="pagina-sub" style="margin:0">até</span>
        <input class="campo" type="date" id="dataFim" style="width:auto">
        <button class="btn btn-primario" id="btnBuscar">Ver</button>
      </div>
    </div>
    <div class="linha" style="margin-bottom:12px">
      <div class="pilulas" id="filtroStatus"></div>
      <div class="pilulas" id="filtroTipo"></div>
      <input class="campo" id="busca" type="search" autocomplete="off" placeholder="🔍 Nome, telefone ou mesa" style="max-width:300px">
    </div>

    <p class="pagina-sub" id="resumo" style="margin-bottom:12px"></p>
    <p class="vazio oculto" id="carregando">Carregando…</p>
    <div id="lista"></div>
  </main>

  <script type="module" src="js/historico.js"></script>
</body>
</html>
