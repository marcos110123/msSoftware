<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios · Painel Gab's</title>
  <link rel="icon" href="img/logo-gabs.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tema.css">
</head>
<body>
  <main id="conteudo" class="pagina oculto">
    <div class="pagina-topo">
      <div>
        <h1 class="pagina-titulo">Relatórios</h1>
        <p class="pagina-sub" id="periodo"></p>
      </div>
    </div>

    <div class="grade-2" style="margin-bottom:16px">
      <div class="card linha">
        <label class="rotulo" style="margin:0">De</label>
        <input class="campo" type="date" id="dataInicio" style="width:auto">
        <label class="rotulo" style="margin:0">até</label>
        <input class="campo" type="date" id="dataFim" style="width:auto">
        <button class="btn btn-primario" id="btnFiltrar">Filtrar</button>
        <button class="btn btn-fantasma" id="btnHoje">Hoje</button>
      </div>
      <div class="card linha">
        <input class="campo" type="number" step="0.01" id="valorAbertura" placeholder="💰 Valor de abertura do caixa" style="flex:1">
        <button class="btn btn-alerta" id="btnAbrirCaixa">Abrir caixa</button>
      </div>
    </div>

    <div class="grade-2">
      <div class="card card-destaque">
        <p class="kpi-rotulo">🧮 Total geral</p>
        <p class="kpi-valor" id="totalGeral">…</p>
      </div>
      <div class="card">
        <h2 class="card-titulo">💳 Total por pagamento</h2>
        <div class="lista-linhas" id="porPagamento">Carregando…</div>
      </div>
      <div class="card">
        <h2 class="card-titulo">🧾 Resumo</h2>
        <div class="lista-linhas" id="entregas">Carregando…</div>
      </div>
      <div class="card">
        <h2 class="card-titulo">📆 Vendas por dia</h2>
        <div class="lista-linhas" id="porDia">Carregando…</div>
      </div>
    </div>
  </main>
  <script type="module" src="js/relatorios.js?v=1.0.1"></script>
</body>
</html>
