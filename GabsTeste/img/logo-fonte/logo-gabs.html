<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:transparent}
  svg{display:block}
  .marca{font-family:'Lilita One',sans-serif}
  .faixa{font-family:'Poppins',sans-serif;font-weight:900}
</style></head>
<body>
<!-- Logo Gab's (vetor) — 1024x1024, fundo transparente -->
<svg id="logo" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="amarelo" cx="45%" cy="38%" r="70%">
      <stop offset="0" stop-color="#FFE766"/><stop offset=".6" stop-color="#FFD21F"/><stop offset="1" stop-color="#FFB800"/>
    </radialGradient>
    <linearGradient id="vermelho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0443A"/><stop offset="1" stop-color="#C41F18"/>
    </linearGradient>
    <linearGradient id="chapeu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDEAE4"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- selo -->
  <g filter="url(#sombra)">
    <circle cx="512" cy="540" r="430" fill="#1E1A16"/>
    <circle cx="512" cy="540" r="404" fill="url(#amarelo)"/>
    <circle cx="512" cy="540" r="384" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="5"/>
  </g>

  <!-- chapéu de chef -->
  <g transform="translate(512 250)" filter="url(#sombra)">
    <g fill="url(#chapeu)" stroke="#1E1A16" stroke-width="16" stroke-linejoin="round">
      <path d="M-150 60 C-235 55 -240 -70 -150 -75 C-150 -170 -40 -190 0 -125 C40 -190 150 -170 150 -75 C240 -70 235 55 150 60 Z"/>
      <rect x="-150" y="40" width="300" height="78" rx="18"/>
    </g>
    <path d="M-95 60 Q-90 0 -60 -30 M0 60 Q0 -10 0 -45 M95 60 Q90 0 60 -30" fill="none" stroke="#1E1A16" stroke-width="9" stroke-linecap="round" opacity=".55"/>
    <rect x="-150" y="40" width="300" height="20" fill="#1E1A16" opacity=".12"/>
  </g>

  <!-- GAB'S -->
  <g transform="translate(512 560) rotate(-5)">
    <text class="marca" x="10" y="16" text-anchor="middle" font-size="262" fill="#C41F18" stroke="#1E1A16" stroke-width="34" stroke-linejoin="round" paint-order="stroke">GAB'S</text>
    <text class="marca" x="0" y="0" text-anchor="middle" font-size="262" fill="#FFFFFF" stroke="#1E1A16" stroke-width="30" stroke-linejoin="round" paint-order="stroke">GAB'S</text>
  </g>

  <!-- faixa -->
  <g transform="translate(512 760)" filter="url(#sombra)">
    <path d="M-395 -58 L-330 -70 L-330 52 L-395 64 L-360 3 Z" fill="#A31812" stroke="#1E1A16" stroke-width="10" stroke-linejoin="round"/>
    <path d="M395 -58 L330 -70 L330 52 L395 64 L360 3 Z" fill="#A31812" stroke="#1E1A16" stroke-width="10" stroke-linejoin="round"/>
    <path d="M-340 -66 Q0 -96 340 -66 L340 58 Q0 28 -340 58 Z" fill="url(#vermelho)" stroke="#1E1A16" stroke-width="12" stroke-linejoin="round"/>
    <text class="faixa" x="0" y="16" text-anchor="middle" font-size="47" letter-spacing="2" fill="#FFFFFF">PIZZARIA &amp; ESFIHARIA</text>
  </g>

  <!-- cidade -->
  <text class="faixa" x="512" y="900" text-anchor="middle" font-size="30" letter-spacing="10" fill="#1E1A16" opacity=".75">URUPÊS · SP</text>
</svg>
</body></html>
